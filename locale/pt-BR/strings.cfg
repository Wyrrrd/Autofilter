[mod-description]
Autofilter=Definir automaticamente os filtros do insersor com base no inventário/esteira adjacente.

[mod-setting-name]
autofilter_mode=Modo de filtro automático

[mod-setting-description]
autofilter_mode=Configure a prioridade de fontes de leitura (conteúdo = conteúdos do inventário, filtro = filtro do inventário, esteira = conteúdo da esteira, checar = busca por inserção na posição de saída).

[tips-and-tricks-item-name]
autofilter=Autofiltro

[tips-and-tricks-item-description]
autofilter=Quando você posiciona manualmente um [entity=inserter] (e se os filtros automáticos estão ativos nas configurações), ele lê o conteúdo dos inventários, filtros de inventário ou conteúdo de esteiras no lado de coleta e define o seu filtro para esses itens.\n\nExiste apenas um campo de texto para inserir a configuração deste comportamento. Isso pode ser feito a qualquer momento, inclusive durante o jogo. Você pode adicionar cada uma das palavras-chaves a seguir ao campo de texto, em qualquer ordem, separadas por espaços. Elas serão processadas da esquerda para a direita.\n\n - conteúdos: Verifica, no conteúdo do inventário na posição de coleta do [entity=inserter], se há itens que podem servir como filtro.\n - filtro: Verifica, nas configurações de filtro do inventário na posição de coleta do [entity=inserter], se há itens que podem servir como filtro.\n - esteira: Verifica, nos itens presentes em uma [entity=transport-belt] ou [entity=splitter] na posição de coleta do [entity=inserter], se há itens que podem servir como filtro.\n - checar: Verifica se os itens candidatos a filtro atuais podem ser inseridos no inventário na posição de depósito do [entity=inserter]; caso não seja possível, eles são removidos da lista de candidatos.\n - Qualquer outro termo será ignorado. Se desejar desativar toda a funcionalidade do Autofiltro, basta digitar qualquer coisa no campo de texto.\n\nApós o processamento, o sistema remove duplicatas, mantendo apenas a primeira ocorrência de cada item na lista de candidatos a filtro e, em seguida, os candidatos são aplicados ao filtro do [entity=inserter] até que ele esteja totalmente preenchido.

[shortcut-name]
autofilter=Autofiltro

